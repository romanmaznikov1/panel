<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover — чтобы панель занимала экран целиком под «чёлкой»,
       а отступы мы сами берём из env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ПЛЯСКИ — панель учёта</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <!-- Панель можно положить на домашний экран телефона: тогда она открывается
       без адресной строки, отдельным окном — и вход запоминается надолго. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ПЛЯСКИ">
  <!-- Панель только тёмная: строка состояния телефона — светлым текстом
       поверх тёмного фона, без белой полосы сверху. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="color-scheme" content="dark">
</head>
<body>
  <div class="gate" id="gate" hidden>
    <form class="gate__card" id="loginForm">
      <img class="gate__logo" src="/logo.webp" alt="ПЛЯСКИ" width="200" height="118">
      <p class="gate__sub">Вход в панель учёта</p>
      <label class="field"><span>Логин</span><input name="login" type="text" autocomplete="username" autocapitalize="off" autofocus required></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="gate__error" id="gateError" hidden></p>
      <button class="btn btn--primary" type="submit">Войти</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <div class="nav-scrim" id="navScrim" hidden></div>
    <aside class="rail" id="rail">
      <div class="brand">
        <img class="brand__logo" src="/logo.webp" alt="ПЛЯСКИ" width="120" height="71">
        <span class="brand__text">
          <small>панель учёта</small>
        </span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav__item" data-view="dashboard">
          <span class="nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7.5" rx="1.5"/></svg></span>Сводка
        </button>
        <button class="nav__item is-active" data-view="attendance">
          <span class="nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M8 3v3M16 3v3"/><path d="M8.5 14l2.3 2.3L15.5 12"/></svg></span>Посещаемость
        </button>
        <button class="nav__item" data-view="students">
          <span class="nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c0-3.4 2.8-6 6.2-6s6.2 2.6 6.2 6"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.5 14.2c2.9.3 5 2.7 5 5.8"/></svg></span>Ученики
        </button>
        <button class="nav__item" data-view="finance">
          <span class="nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Финансы
        </button>
        <button class="nav__item" data-view="salaries">
          <span class="nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M5.5 6v12M18.5 6v12"/></svg></span>Зарплаты
        </button>
        <button class="nav__item" data-view="subscriptions">
          <span class="nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19.5V4.5"/><path d="M8 7h7M8 10.5h7"/></svg></span>Справочники
        </button>
      </nav>

      <div class="rail__foot">
        <div class="who" id="who" hidden>
          <span class="who__name" id="whoName"></span>
          <span class="who__role" id="whoRole"></span>
          <span class="who__links">
            <button class="link-btn" id="passwordBtn" type="button">Сменить пароль</button>
            <button class="link-btn" id="logoutBtn" type="button">Выйти</button>
          </span>
        </div>
        <button class="ghost-btn" id="exportBtn" type="button">Экспорт в Excel</button>
        <p class="file-note" id="dbNote"></p>
        <p class="file-note" id="exportNote"></p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="burger" id="menuBtn" type="button" aria-label="Разделы" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar__title">
          <p class="eyebrow" id="viewEyebrow">Занятия</p>
          <h1 id="viewTitle">Посещаемость</h1>
        </div>
        <div class="topbar__tools">
          <div class="segmented" id="branchFilter" role="group" aria-label="Филиал"></div>
          <!-- Второстепенные действия раздела (outline) — на широком экране в шапке,
               на телефоне тот же набор рисуется внутри раздела. -->
          <div class="topbar__tools only-desktop" id="viewActions"></div>
          <!-- На телефоне — круглая «+» справа от заголовка, как в приложениях
               iPhone; на широком экране — кнопка с подписью. -->
          <button class="btn btn--primary topbar__add" id="primaryAction" type="button" aria-label="Добавить ученика">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="topbar__add-label">Добавить ученика</span>
          </button>
        </div>
      </header>

      <div class="view" id="view"></div>
    </main>

    <!-- Нижняя панель вкладок — только на телефоне. До разделов достаёт
         большой палец, а не нужно тянуться к меню в углу. Редкие разделы
         и настройки — во вкладке «Ещё». -->
    <nav class="tabbar" id="tabbar" aria-label="Разделы">
      <button class="tab" type="button" data-view="dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <span>Сводка</span>
      </button>
      <button class="tab" type="button" data-view="attendance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/><path d="M8.8 14.6l2.2 2.2 4.4-4.4"/></svg>
        <span>Занятия</span>
      </button>
      <button class="tab" type="button" data-view="students">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c0-3.5 2.8-6.2 6.2-6.2s6.2 2.7 6.2 6.2"/><circle cx="17.2" cy="8.6" r="2.5"/><path d="M15.6 14.1c3 .3 5.1 2.8 5.1 5.9"/></svg>
        <span>Ученики</span>
      </button>
      <button class="tab" type="button" data-view="finance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17l5.5-5.5 4 4 7.5-7.5"/><path d="M15 8h5.5v5.5"/></svg>
        <span>Финансы</span>
      </button>
      <button class="tab" type="button" data-tab-more>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        <span>Ещё</span>
      </button>
    </nav>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="saving" id="saving" hidden><span class="saving__pulse"></span>Сохраняю…</div>

  <script src="/ios.js"></script>
  <script src="/app.js"></script>
</body>
</html>
